  <!-- Wordmark "Copilot" -->
  <text x="76" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Copilot</text>
  <text x="77" y="18" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 

      <stop offset="50%" stop-color="#00A2ED" />
      <stop offset="100%" stop-color="#00D2B4" />
    </linearGradient>
    <linearGradient id="copilot-g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5D39" />
      <stop offset="45%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
    <linearGradient id="copilot-g3" x1="0%" y1="100%" x2="100%" y2="0%">
